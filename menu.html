<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <title>MycoGarden</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rectangle1">
        <button class="close-button" id="close-btn">x</button>

        <h1>MycoGarden</h1>

        <div class="rectangle2">
            <h2>The Mycologist's Grimoire</h2>
            
            <div class="rectangle3">
                <span style="color: #311B17;">Type: </span><span style="color: #B12222;">Embercap</span><br>
                <span style="color: #311B17;">Growth time: </span><br><span style="color: #B12222;">4 days</span> 
            </div>
            <img src="./assets/red-mushroom1.png" alt="Red Mushroom" style="left: 3%;">

            <div class="rectangle3">
                <span style="color: #311B17;">Type: </span><span style="color: #5A1991;">Twillight Shroom</span><br>
                <span style="color: #311B17;">Growth time: </span><br><span style="color: #5A1991;">6 days</span>
            </div>
            <img src="./assets/purple-mushroom1.png" alt="Purple Mushroom" style="left: 35%;">

            <div class="rectangle3">
                <span style="color: #311B17;">Type: </span><span style="color: #FF82CE;">Cotton Puff</span><br>
                <span style="color: #311B17;">Growth time: </span><br><span style="color: #FF82CE;">3 days</span>
            </div>   
            <img src="./assets/pink-mushroom1.png" alt="Pink Mushroom" style="left: 67%;">
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
